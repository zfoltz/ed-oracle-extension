<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <span>Ed Oracle</span>
    </div>
    <div class="head-actions">
      <button id="sync-btn" class="icon-btn" title="Sync now">&#8635;</button>
      <button id="settings-btn" class="icon-btn" title="Settings">&#9881;</button>
    </div>
  </header>

  <nav>
    <button class="tab active" data-tab="ask">Ask</button>
    <button class="tab" data-tab="history">History</button>
    <button class="tab" data-tab="threads">Threads</button>
  </nav>

  <!-- ASK -->
  <section id="tab-ask" class="tab-panel active">
    <textarea id="question" placeholder="Ask anything about the course board... e.g. &quot;is a calculator allowed on the quiz?&quot;" rows="3"></textarea>
    <button id="ask-btn" class="primary">Ask the Oracle</button>
    <div id="ask-progress" class="progress hidden"></div>
    <div id="ask-answer" class="answer hidden"></div>
  </section>

  <!-- HISTORY -->
  <section id="tab-history" class="tab-panel">
    <div class="row-between">
      <span id="history-count" class="muted"></span>
      <button id="clear-history" class="link-btn danger">Clear all</button>
    </div>
    <div id="history-list"></div>
  </section>

  <!-- THREADS -->
  <section id="tab-threads" class="tab-panel">
    <input id="thread-search" type="search" placeholder="Search cached threads, answers, comments..." />
    <div id="thread-results"></div>
  </section>

  <footer>
    <span id="status" class="muted">...</span>
  </footer>

  <script src="lib/db.js"></script>
  <script src="lib/ed.js"></script>
  <script src="lib/agent.js"></script>
  <script src="popup.js"></script>
</body>
</html>
